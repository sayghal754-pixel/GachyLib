{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Книжная полка{% endblock %}</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#24221f;background:#fff}*{box-sizing:border-box}body{margin:0;background:#fff}a{color:inherit;text-decoration:none}.top{background:#c62828;color:#fff}.nav{max-width:1120px;margin:auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:750;color:#fff}.brand img{width:48px;height:48px;object-fit:cover;object-position:50% 29%;border-radius:50%;box-shadow:0 2px 8px #4b101088}.navlinks{display:flex;gap:18px;align-items:center}.navlinks a:not(.button){color:#fff}.wrap{max-width:1120px;margin:42px auto;padding:0 24px}h1{font-size:clamp(30px,5vw,46px);margin:0 0 10px}.muted{color:#77736b}.search{margin:26px 0;display:flex;gap:10px}.search input,.field input{font:inherit;padding:12px 14px;border:1px solid #d8d3c8;border-radius:10px;background:white}.search input{flex:1}.button{font:inherit;border:0;border-radius:10px;background:#a61f2b;color:white;padding:11px 18px;cursor:pointer;display:inline-block;transition:background .18s ease,transform .18s ease}.button:hover{background:#851925;transform:translateY(-1px)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}.card{background:white;border:1px solid #e9e5dc;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s ease,box-shadow .2s ease}.card:hover{transform:translateY(-4px);box-shadow:0 10px 26px #24170f14}.cover{aspect-ratio:3/4;background:#f4f0eb;display:grid;place-items:center;overflow:hidden;color:#928d82}.cover img{width:100%;height:100%;object-fit:cover}.cover-placeholder{font-size:54px;opacity:.55}.cardbody{padding:16px;display:flex;flex:1;flex-direction:column}.card h2{font-size:19px;line-height:1.3;margin:0 0 8px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.card p{font-size:14px;line-height:1.5;color:#6f6b64;margin:0 0 16px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden}.actions{display:flex;gap:8px;margin-top:auto}.book-action{flex:1;text-align:center;font-size:13px;font-weight:650;padding:9px 8px;border-radius:8px;transition:background .18s ease,color .18s ease}.read-action{background:#a61f2b;color:#fff}.read-action:hover{background:#851925}.download-action{border:1px solid #a61f2b;color:#a61f2b}.download-action:hover{background:#fff2f2}.empty{text-align:center;padding:56px 20px;background:#fff;border-radius:14px;grid-column:1/-1}.formbox{max-width:440px;margin:0 auto;background:white;padding:26px;border:1px solid #e9e5dc;border-radius:14px}.field{margin:16px 0}.field label{display:block;margin-bottom:6px}.field input{width:100%}.errorlist{color:#a33;padding-left:20px}.more{display:block;margin:28px auto}.footer{text-align:center;padding:34px;color:#8b877f}
    .reader-page{max-width:980px;margin:0 auto}.back-link{color:#a61f2b;font-weight:600}.reader-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:24px 0}.reader-heading h1{font-size:clamp(25px,4vw,36px)}.reader-kicker{font-size:12px;font-weight:750;letter-spacing:.12em;color:#a61f2b;margin:0 0 8px}.pdf-reader{display:block;width:100%;height:calc(100vh - 230px);min-height:560px;border:1px solid #e5e0d8;border-radius:12px;background:#f4f0eb}.text-reader{white-space:pre-wrap;font:16px/1.8 Georgia,serif;padding:clamp(20px,5vw,56px);border:1px solid #e9e5dc;border-radius:12px;min-height:60vh}.reader-message{padding:36px;background:#faf8f5;border:1px solid #e9e5dc;border-radius:14px}.reader-message p{color:#77736b;line-height:1.6}
    @media(max-width:600px){.reader-heading{align-items:flex-start;flex-direction:column}.pdf-reader{height:75vh;min-height:420px}.brand{font-size:17px}.nav{padding:12px 16px}.navlinks{gap:10px}}
  </style>
</head>
<body>
<header class="top"><nav class="nav"><a class="brand" href="{% url 'home' %}"><img src="{% static 'bibliory/images/site-logo.jpeg' %}" alt="Логотип Дворфы подпивасы"><span>Дворфы подпивасы</span></a><div class="navlinks">{% if user.is_authenticated %}<span>{{ user.username }}</span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="button" type="submit">Сойти с помоста</button></form>{% else %}<a href="{% url 'login' %}">В зал</a><a class="button" href="{% url 'register' %}">Вступить в зал</a>{% endif %}</div></nav></header>
<main class="wrap">{% block content %}{% endblock %}</main>
<footer class="footer">Качаем мозг — по одной странице за подход.</footer>
{% block scripts %}{% endblock %}
</body>
</html>
