services:
  - type: web
    name: dworfi-biblioteka
    runtime: python
    rootDir: main
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn main.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: dworfi-biblioteka-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "1"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: dworfi-biblioteka-db
    plan: free
    databaseName: dworfi_biblioteka
    user: dworfi_biblioteka
